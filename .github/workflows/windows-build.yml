name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out XESS5
        uses: actions/checkout@v4

      - name: Configure the x64 application
        run: cmake -S . -B build -A x64

      - name: Compile Release
        run: cmake --build build --config Release --parallel
