name: Build TrSS Data Recorder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "trss/recorder.py"
      - "tests/test_recorder.py"
      - "pyproject.toml"
      - "run_recorder.py"
      - ".github/workflows/build-recorder.yml"
      - "docs/RECORDER.md"
      - "docs/RECORDER-RELEASE.md"
    tags:
      - "recorder-v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Test and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install pyinstaller

      - name: Run project tests
        run: python -m pytest -q

      - name: Build portable recorder
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TrSS-Data-Recorder --collect-all PIL run_recorder.py

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $file = "dist\TrSS-Data-Recorder.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$file.sha256" -Value "$hash  TrSS-Data-Recorder.exe" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrSS-Data-Recorder-windows-x64
          path: |
            dist/TrSS-Data-Recorder.exe
            dist/TrSS-Data-Recorder.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/recorder-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist\TrSS-Data-Recorder.exe dist\TrSS-Data-Recorder.exe.sha256 --title "TrSS Data Recorder $tag" --notes-file docs\RECORDER-RELEASE.md
