name: Build TrSS Game Library

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "trss/recorder.py"
      - "trss/game_hub.py"
      - "tests/test_recorder.py"
      - "tests/test_game_hub.py"
      - "pyproject.toml"
      - "run_recorder.py"
      - ".github/workflows/build-recorder.yml"
      - "docs/RECORDER.md"
      - "docs/RECORDER-RELEASE.md"
      - "scripts/fetch_presentmon.ps1"
      - "vendor/presentmon/NOTICE.txt"
    tags:
      - "game-library-v*"

permissions:
  contents: write

jobs:
  windows-portable:
    name: Test and package Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install pyinstaller

      - name: Run project tests
        run: python -m pytest -q

      - name: Download and verify the pinned frame telemetry engine
        shell: pwsh
        run: .\scripts\fetch_presentmon.ps1

      - name: Build portable game library
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TrSS-Game-Library --collect-all PIL
          --add-binary "vendor\presentmon\PresentMon-2.6.0-x64.exe;presentmon"
          --add-data "vendor\presentmon\NOTICE.txt;presentmon"
          run_recorder.py

      - name: Include third-party telemetry notice
        shell: pwsh
        run: Copy-Item vendor\presentmon\NOTICE.txt dist\PRESENTMON-NOTICE.txt

      - name: Calculate SHA-256
        shell: pwsh
        run: |
          $file = "dist\TrSS-Game-Library.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$file.sha256" -Value "$hash  TrSS-Game-Library.exe" -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrSS-Game-Library-windows-x64
          path: |
            dist/TrSS-Game-Library.exe
            dist/TrSS-Game-Library.exe.sha256
            dist/PRESENTMON-NOTICE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/game-library-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag dist\TrSS-Game-Library.exe dist\TrSS-Game-Library.exe.sha256 dist\PRESENTMON-NOTICE.txt --title "TrSS Game Library $tag" --notes-file docs\RECORDER-RELEASE.md
