name: TrSS model and training tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TrSS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch and TrSS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]"

      - name: Check Python syntax
        run: python -m compileall -q trss tests

      - name: Test model shape, composition, gradients, and dataset contracts
        run: python -m pytest tests/test_training.py tests/test_training_manifest.py tests/test_training_infer.py tests/test_split_manifest.py tests/test_dataset_audit.py tests/test_review_dataset.py tests/test_generate_scene_dataset.py
