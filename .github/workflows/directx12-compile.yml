name: DirectX 9, 11, and 12 backend checks

on:
  push:
    branches: [main, feature/dataset-capture-tool]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directx12-build:
    runs-on: windows-latest
    steps:
      - name: Check out TrSS
        uses: actions/checkout@v4

      - name: Configure the native DirectX 9/11/12 probes
        run: cmake -S native/directx12 -B build/directx12 -A x64

      - name: Compile all native DirectX API probes
        run: cmake --build build/directx12 --config Release --parallel

      - name: Run the D3D9 adapter and runtime survey
        run: .\build\directx12\Release\trss_d3d9_probe.exe --list-devices

      - name: Run the D3D11 compute roundtrip on WARP
        run: .\build\directx12\Release\trss_d3d11_probe.exe --warp-self-test

      - name: Run the D3D12 compute roundtrip on WARP
        run: .\build\directx12\Release\trss_dx12_probe.exe --warp-self-test


      - name: Smoke-test the desktop capture PNG encoder
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "build/directx12/capture-self-test.png"
          .\build\directx12\Release\trss_desktop_capture.exe --self-test-png $path
          if (!(Test-Path $path)) { throw "PNG self-test output was not created." }
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $signature = [byte[]](137, 80, 78, 71, 13, 10, 26, 10)
          if ($bytes.Length -lt 8) { throw "PNG self-test output is too short." }
          for ($i = 0; $i -lt 8; $i++) {
            if ($bytes[$i] -ne $signature[$i]) { throw "PNG self-test signature mismatch." }
          }
