[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trss"
version = "0.1.0"
description = "An experimental, local-first neural-rendering research engine targeting Intel Arc GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gpu = ["openvino>=2025.0"]
training = ["torch>=2.5"]
export = ["torch>=2.5", "onnx>=1.16", "onnxruntime>=1.20"]
test = ["pytest>=8.0"]

[project.scripts]
trss = "trss.cli:main"
trss-split-dataset = "trss.training.split_manifest:main"
trss-audit-dataset = "trss.training.audit_dataset:main"
trss-review-dataset = "trss.training.review_dataset:main"
trss-generate-scene-dataset = "trss.training.generate_scene_dataset:main"
trss-prepare-pilot = "trss.training.prepare_pilot:main"
trss-evaluate-checkpoint = "trss.training.evaluate_checkpoint:main"
trss-export-onnx = "trss.training.export_onnx:main"
trss-run-onnx-frame = "trss.training.infer_onnx:main"

[tool.setuptools.packages.find]
include = ["trss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
