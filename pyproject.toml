[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trss"
version = "0.1.0"
description = "An experimental, local-first neural-rendering research engine targeting Intel Arc GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gpu = ["openvino>=2025.0"]
training = ["torch>=2.5"]
test = ["pytest>=8.0"]

[project.scripts]
trss = "trss.cli:main"
trss-split-dataset = "trss.training.split_manifest:main"
trss-audit-dataset = "trss.training.audit_dataset:main"
trss-review-dataset = "trss.training.review_dataset:main"
trss-recorder = "trss.game_hub:main"
trss-runtime-installer = "trss.runtime_installer:main"
trss-compare-performance = "trss.performance_compare:main"
trss-window-recorder = "trss.recorder:main"

[tool.setuptools.packages.find]
include = ["trss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
